name: Build Debug APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: gradle

    - name: Grant Gradle permissions
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew clean assembleStfdroidDebug --stacktrace

    - name: Publish direct download release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: SmartTube latest debug build
        prerelease: true
        files: smarttubetv/build/outputs/apk/stfdroid/debug/*universal*.apk

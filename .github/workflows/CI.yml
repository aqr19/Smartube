# =========================================================
# Build and publish the TV build and updater manifest for every master push.
# =========================================================

name: Build Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# لازم هذا السطر عشان نقدر ننشر Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # 1) تنزيل الكود كامل + المكتبات الفرعية (SharedModules, MediaServiceCore)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2) تجهيز بيئة جافا اللازمة للبناء
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      # 3) صلاحية تشغيل أداة البناء
      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Set build version
        run: |
          echo "APP_VERSION_CODE=$((2435 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=32.$((45 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # Keep the stable debug signing key so Android accepts in-place updates.
      - name: Build Debug APK
        run: ./gradlew clean assembleStfdroidDebug -PAPP_VERSION_CODE="$APP_VERSION_CODE" -PAPP_VERSION_NAME="$APP_VERSION_NAME" --stacktrace

      - name: Prepare stable TV download and update manifest
        env:
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          apk_source=$(find smarttubetv/build/outputs/apk/stfdroid/debug -name '*universal*.apk' -print -quit)
          test -n "$apk_source" && test -s "$apk_source"
          cp "$apk_source" SmartTube_fdroid_latest_universal.apk
          export DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/SmartTube_fdroid_latest_universal.apk"
          python3 - <<'PY'
          import json
          import os

          version_name = os.environ["APP_VERSION_NAME"]
          version_code = int(os.environ["APP_VERSION_CODE"])
          changelog = os.environ.get("CHANGELOG", "").strip() or "Interface and player improvements."
          manifest = {
              "package": {"downloadUrl": os.environ["DOWNLOAD_URL"]},
              version_name: {"versionCode": version_code, "changelog": [changelog]},
          }
          with open("smarttube_fdroid.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, ensure_ascii=False, indent=2)
              output.write("\n")
          PY

      # Keep these stable filenames: the app and Downloader code point here.
      - name: Publish direct download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SmartTube TV latest build
          prerelease: true
          overwrite_files: true
          files: |
            SmartTube_fdroid_latest_universal.apk
            smarttube_fdroid.json
